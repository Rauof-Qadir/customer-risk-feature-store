
name: Customer Risk Feature Store Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb pytest

      - name: Run synthetic and SQL integration tests
        run: |
          python -m pytest -v \
            tests/test_customer_features_sql.py \
            tests/test_synthetic_customer_features.py \
            tests/test_feature_dataset_quality.py
